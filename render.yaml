services:
  - type: web
    name: leadbridge-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_PRISMA
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://leadbridge-seven.vercel.app
      - key: WEBHOOK_URL
        value: https://leadbridge-zy4o.onrender.com
      - key: PHONE_PROVIDER
        value: omnidimension
      - key: VOICE_AI_PROVIDER
        value: omnidimension
      - key: DEMO_MODE
        value: "false"
      - key: OMNIDIM_API_KEY
        sync: false
      - key: OMNIDIM_BASE_URL
        value: https://backend.omnidim.io/api/v1
